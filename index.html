<title>建国サクセス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: スマホ一列のアプリ。上に国の帯と、建物が増えていく国の挿絵。その下に能力表と「この3年の事業」。3年ごとに年代記が積もる */
:root{
  --bg:#E6EBEE; --surface:#FFFFFF; --surface-2:#EFF3F5; --ink:#15202B; --muted:#596673; --line:#D0D9DE;
  --primary:#25368C; --primary-ink:#FFFFFF; --primary-soft:#E1E5F6;
  --gold:#8F6300; --gold-bg:#FFF0C2; --blue:#2160C4; --blue-bg:#E0EAFB; --red:#B12F24; --red-bg:#FAE1DC;
  --atk:#CF4238; --def:#2A66CF; --mob:#138F64; --pow:#C27F06;
  --good:#138F64; --warn:#B87200; --bad:#BF3328;
  --f-plain:#C3DBA9; --f-mount:#CDC4B4; --f-sea:#A8CAE2; --f-snow:#E6EEF4; --f-sand:#EAD5A3; --f-mark:rgba(21,32,43,.16);
  --shadow:0 1px 0 rgba(21,32,43,.04), 0 8px 24px -16px rgba(21,32,43,.35);
  --font-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --font-head:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif;
  --font-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic','Noto Sans JP',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#172027; --surface-2:#1E2930; --ink:#E6ECF0; --muted:#97A5AF; --line:#2B3740;
  --primary:#9AA7FF; --primary-ink:#0E1317; --primary-soft:#232B4D;
  --gold:#EBBE52; --gold-bg:#3A2F12; --blue:#82AAFF; --blue-bg:#1A2944; --red:#FF8A7C; --red-bg:#3C1F1B;
  --atk:#FF776C; --def:#72A1FF; --mob:#4DCB97; --pow:#F2B947;
  --good:#4DCB97; --warn:#F2B947; --bad:#FF776C;
  --f-plain:#2D4128; --f-mount:#3C3830; --f-sea:#1C3448; --f-snow:#2E3A44; --f-sand:#4A3E25; --f-mark:rgba(230,236,240,.14);
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#172027; --surface-2:#1E2930; --ink:#E6ECF0; --muted:#97A5AF; --line:#2B3740;
  --primary:#9AA7FF; --primary-ink:#0E1317; --primary-soft:#232B4D;
  --gold:#EBBE52; --gold-bg:#3A2F12; --blue:#82AAFF; --blue-bg:#1A2944; --red:#FF8A7C; --red-bg:#3C1F1B;
  --atk:#FF776C; --def:#72A1FF; --mob:#4DCB97; --pow:#F2B947;
  --good:#4DCB97; --warn:#F2B947; --bad:#FF776C;
  --f-plain:#2D4128; --f-mount:#3C3830; --f-sea:#1C3448; --f-snow:#2E3A44; --f-sand:#4A3E25; --f-mark:rgba(230,236,240,.14);
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-head);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.quiet{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}

button{font:inherit;color:inherit}
.btn{font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);cursor:pointer;width:100%;transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{width:auto;font-size:14px;padding:9px 14px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}

/* タイトル */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:18px 6px}
.logo{font-family:var(--font-display);font-weight:400;font-size:clamp(44px, 13vw, 64px);letter-spacing:.02em;line-height:1.05}
.logo span{display:block;color:var(--primary)}
.lead{font-size:16px;max-width:34em}
.steps{display:grid;gap:10px;counter-reset:step;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:step;content:counter(step);font-family:var(--font-head);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.steps b{display:block}

/* 能力表 */
.stats{display:flex;flex-direction:column;gap:7px}
.srow{display:grid;grid-template-columns:3.2em 1fr 2.2em 1.4em;gap:10px;align-items:center}
.slabel{font-weight:700;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .5s ease}
.sval{font-family:var(--font-head);font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.rk{font-family:var(--font-head);font-size:17px;text-align:center;color:var(--muted)}
.rk-S{color:var(--gold)} .rk-A{color:var(--atk)} .rk-B{color:var(--pow)} .rk-C{color:var(--mob)} .rk-D{color:var(--def)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.up{color:var(--c)}
.chip.mult{color:var(--primary);background:var(--primary-soft)}
.sp{font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
.sp.gold{background:var(--gold-bg);color:var(--gold);border-color:color-mix(in srgb, var(--gold) 35%, transparent)}
.sp.blue{background:var(--blue-bg);color:var(--blue)}
.sp.red{background:var(--red-bg);color:var(--red)}
.splist{display:flex;flex-direction:column;gap:8px}
.splist div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.type{font-family:var(--font-head);font-size:13px;padding:3px 10px;border-radius:8px;color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);white-space:nowrap}

/* 国の帯 */
.nation{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.nation h2{font-size:22px;overflow-wrap:anywhere}
.flag{display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line);flex:none}
.bigrank{font-family:var(--font-head);font-size:44px;line-height:1;text-align:center}
.bigrank small{display:block;font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}

/* 問い */
.qhead{display:flex;justify-content:space-between;align-items:center}
.pips{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.pips i{height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--primary)}
.pips i.win{background:var(--good)} .pips i.lose{background:var(--bad)}
.q{font-size:28px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt-k{font-family:var(--font-head);font-size:20px}
.opt-why{font-size:13px;color:var(--muted)}

/* 育成 */
.period{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.period b{font-family:var(--font-head);font-weight:700;font-size:18px}
.morale{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center}
.mstate{font-size:12px;font-weight:700;color:var(--c)}
.cards{display:grid;gap:10px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--primary)}
.pcard .ck{font-family:var(--font-head);font-size:19px}
.pcard .cd{font-size:13px;color:var(--muted)}
.pcard .cg{font-size:12px;font-weight:700;color:var(--primary)}
.pcard.comp-card{background:var(--gold-bg);border-color:color-mix(in srgb, var(--gold) 30%, transparent)}
.pcard.comp-card .cg{color:var(--gold)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.comp{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.comp b{font-family:var(--font-head);font-weight:700;font-size:15px}
.comp .bond{color:var(--gold);letter-spacing:.15em;font-size:12px}
.comp.off{opacity:.55}
.frame{border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;background:var(--surface-2);max-width:100%}
.frame svg{display:block;width:100%;height:100%}
.pcard{flex-direction:row;align-items:center;gap:12px}
.pcard .thumb{flex:none;width:112px;aspect-ratio:104/58;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.pcard .thumb svg{display:block;width:100%;height:100%}
.pcard .ptext{display:flex;flex-direction:column;gap:3px;min-width:0}
.cause{align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-bg);padding:3px 10px;border-radius:999px}
.cause::before{content:"↩ "}
.chain{list-style:none;margin:0 0 6px 6px;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:14px}
.chain li{position:relative;display:grid;grid-template-columns:3.4em 1fr;gap:6px}
.chain li::before{content:"";position:absolute;left:-19px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--line)}
.chain li.root::before{background:var(--gold)}
.chain li.root{font-weight:700}
.chain .y{font-family:var(--font-head);color:var(--muted);font-variant-numeric:tabular-nums}
.verdict-line{text-align:center;font-weight:700;color:var(--muted)}
.fates li.bad{color:var(--bad)}
@media (max-width:420px){.pcard .thumb{width:96px}}
.story{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.9}
.judge{font-family:var(--font-head);font-size:18px;line-height:1.6}
.reveal .bar i{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.closing{font-size:16px;line-height:1.9}
.fates{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pips i.war{outline:2px solid color-mix(in srgb, var(--bad) 55%, transparent);outline-offset:1px}
.ev h3{font-size:22px}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice:hover{border-color:var(--primary)}
.choice b{font-size:15px}
.choice span{font-size:12px;color:var(--muted)}
.got{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--gold-bg)}
.got .eyebrow{color:var(--gold)}
.chron{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.chron li{display:grid;grid-template-columns:3.6em 1fr;gap:8px}
.chron .y{font-family:var(--font-head);color:var(--muted);font-variant-numeric:tabular-nums}
.chron.scroll{max-height:260px;overflow:auto;padding-right:4px}

/* 戦役 */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;flex-direction:column;gap:8px;min-width:0}
.mini h3{font-size:16px;overflow-wrap:anywhere}
.mini .stats .srow{grid-template-columns:2.2em 1fr 1.3em;gap:6px}
.mini .sval{display:none}
.hint{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.hint b{color:var(--c)}
.tactics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tac{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tac b{font-family:var(--font-head);font-weight:700;font-size:16px}
.tac span{font-size:11px;color:var(--muted);line-height:1.45}
.tac.sel{border-color:var(--primary);background:var(--primary-soft)}

/* 観戦 */
.bhead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.bside{display:flex;flex-direction:column;gap:4px;min-width:0}
.bside.r{text-align:right}
.bside b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stam{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.stam i{display:block;height:100%;background:var(--c);width:100%}
.bside.r .stam i{margin-left:auto}
.vsmark{font-family:var(--font-head);color:var(--muted);font-size:14px;padding-bottom:2px}
.arena{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.arena canvas{display:block;width:100%;height:230px}
.field-tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface);color:var(--ink);opacity:.92}
.blog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:170px;overflow:auto}
.blog li{padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.blog li.p{color:var(--ink);box-shadow:inset 3px 0 0 var(--cp)}
.blog li.e{color:var(--ink);box-shadow:inset -3px 0 0 var(--ce);text-align:right}
.blog li.n{color:var(--muted);text-align:center;background:none}
.verdict{font-family:var(--font-head);font-size:40px;line-height:1.1}
.verdict.win{color:var(--good)} .verdict.lose{color:var(--bad)}
.reasons{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}

.legend{font-size:20px;font-family:var(--font-head);color:var(--gold);text-align:center;padding:8px;border-radius:10px;background:var(--gold-bg)}
.title-big{font-family:var(--font-head);font-size:34px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;z-index:20}
textarea.copybox{width:100%;min-height:150px;font:inherit;font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
input.name{font-family:var(--font-head);font-size:22px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.hall{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hall li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hall .rec{font-family:var(--font-head);font-size:14px;font-variant-numeric:tabular-nums}
.opt-k,.pcard .ck,.sval,.rk,.bigrank,.title-big,.verdict,.type,.vsmark,.steps li::before{font-weight:700}
.judge{font-weight:500}
.chron .y,.chain .y{font-weight:500}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} .btn{transition:none} .reveal .bar i{animation:none} }
</style>

<main id="app" class="app" aria-live="polite"></main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ===== ゲームの中身（DOMに依存しない部分） ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const roll=p=>Math.random()<p;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const STAT_KEYS=['atk','def','mob','pow'];
const LABEL={atk:'攻撃',def:'守備',mob:'機動',pow:'国力',morale:'民心'};
const SHORT={atk:'攻',def:'守',mob:'機',pow:'力',morale:'民心'};
const rankOf=v=>v>=90?'S':v>=80?'A':v>=70?'B':v>=60?'C':v>=50?'D':v>=40?'E':v>=20?'F':'G';

/* 建国の問い。効果(d)は画面に出さない */
const QUESTIONS=[
 {id:'terrain',q:'長い旅の果てに、あなたが足を止めた土地は',opts:[
  {k:'山岳',t:'雪をいただく山に囲まれた谷',d:{def:12,mob:-6},flags:['山岳']},
  {k:'海',t:'潮風の吹く入り江',d:{mob:10,pow:2},flags:['海']},
  {k:'平野',t:'地平まで続く草原',d:{atk:6,pow:6,def:-6},flags:['平野']},
  {k:'島',t:'霧に包まれた島',d:{def:8,mob:6,atk:-6},flags:['島']}]},
 {id:'climate',q:'その土地で迎えた、最初の冬は',opts:[
  {k:'寒冷',t:'長く、骨まで凍える冬',d:{def:10,pow:-5},flags:['寒冷'],mult:{fortify:1.2}},
  {k:'温暖',t:'短く、穏やかな冬',d:{pow:8,morale:5},flags:['温暖'],mult:{farm:1.2}},
  {k:'乾燥',t:'乾いた風が吹きやまない冬',d:{mob:6,atk:4,pow:-4},flags:['乾燥']},
  {k:'熱帯',t:'冬と呼べる季節がなかった',d:{pow:10,def:-4},flags:['熱帯']}]},
 {id:'resource',q:'民が最初の冬を越すために頼ったのは',opts:[
  {k:'鉱物',t:'山肌に見つけた鉄',d:{atk:8,pow:2},mult:{arms:1.3}},
  {k:'農作物',t:'皆で拓いた小さな畑',d:{pow:10},mult:{farm:1.3}},
  {k:'漁業',t:'海と川の魚',d:{pow:5,mob:5},flags:['漁業'],mult:{trade:1.25}},
  {k:'技術',t:'旅のあいだに磨いた職人の技',d:{mob:4,def:4},flags:['技術'],mult:{arms:1.1,fortify:1.1,trade:1.1,farm:1.1}}]},
 {id:'population',q:'あなたについてきた民は',opts:[
  {k:'少数精鋭',t:'わずかだが、旅で鍛えられた者たち',d:{mob:10,atk:2,pow:-6}},
  {k:'中規模',t:'百ほどの家族',d:{atk:3,def:3,mob:3,pow:3}},
  {k:'大集団',t:'道中で膨れ上がった大集団',d:{pow:12,atk:6,mob:-8},costMult:1.2}]},
 {id:'education',q:'子どもたちに、まず何を教えるか',opts:[
  {k:'理系',t:'星と数の読み方',d:{mob:5,def:3},flags:['理系']},
  {k:'文系',t:'文字と言葉',d:{pow:4,mob:4},flags:['文系']},
  {k:'芸術',t:'歌と物語',d:{morale:15,pow:2},flags:['芸術']},
  {k:'体育',t:'剣と馬',d:{atk:8,morale:5},flags:['体育']}]},
 {id:'tax',q:'王として、民に求める貢ぎは',opts:[
  {k:'軽い',t:'今は、何も求めない',d:{morale:20,pow:-6}},
  {k:'普通',t:'収穫の一割',d:{}},

function newGame(){
  return {answers:{},flags:[],mult:{},costMult:1,s:{atk:20,def:20,mob:20,pow:20},morale:60,turn:1,
    cnt:{arms:0,fortify:0,trade:0,farm:0,fest:0},prog:{},specials:[],used:[],chron:[],name:'',flag:null,type:null,rank:null,done:false,
    built:[],seeds:{},links:[],battles:[],lastKind:null};
}
const has=(g,f)=>g.flags.includes(f);
function add(g,d){for(const k in d){ if(k==='morale') g.morale=clamp(g.morale+d[k],0,100); else g.s[k]=clamp(g.s[k]+d[k],1,100); }}
function prog(g,k,n=1){g.prog[k]=(g.prog[k]||0)+n}
const snap=g=>({...g.s,morale:g.morale});
function diff(a,b){const d={};for(const k in a){if(b[k]!==a[k])d[k]=b[k]-a[k]}return d}

function buildFromAnswers(ans){
  const g=newGame();
  QUESTIONS.forEach((q,i)=>{
    const o=q.opts[ans[i]]; if(!o) return;
    add(g,o.d||{}); (o.flags||[]).forEach(f=>g.flags.push(f));
    for(const k in (o.mult||{})) g.mult[k]=(g.mult[k]||1)*o.mult[k];
    if(o.costMult) g.costMult*=o.costMult;
    g.answers[q.id]=o.k;
  });
  if(g.answers.tax==='重い') g.flags.push('重税');
  if(g.answers.tax==='軽い') g.flags.push('軽税');
  return g;
}
function checkSpecials(g){
  for(const [id,sp] of Object.entries(SPECIALS)) if(!g.specials.includes(id)&&sp.cond(g)) g.specials.push(id);
  g.specials.sort((a,b)=>TIER_ORDER[SPECIALS[a].tier]-TIER_ORDER[SPECIALS[b].tier]);
}
const failChance=g=>g.morale<30?(30-g.morale)*0.025:0;

const COMMANDS={arms:{stat:'atk',cost:15},fortify:{stat:'def',cost:12},trade:{stat:'mob',cost:8},farm:{stat:'pow',cost:10}};
function npcCommand(g,key){
  if(key==='fest'){g.cnt.fest++;add(g,{morale:30,pow:2});return}
  if(roll(failChance(g))){add(g,{morale:-5});return}
  const c=COMMANDS[key],m=(g.mult[key]||1)*(g.morale>=80?1.2:1);
  add(g,{[c.stat]:Math.round((8+Math.random()*3)*m),morale:-Math.round(c.cost*g.costMult)});
  g.cnt[key]++;
}

const EVENT_BY_ID=Object.fromEntries(EVENTS.map(e=>[e.id,e]));
function weightedPick(pool,wf){
  const ws=pool.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}
const evWeight=g=>e=>typeof e.w==='function'?e.w(g):(e.w||1);
function pickRandomEvent(g,player){
  const pool=EVENTS.filter(e=>!(player&&e.npcOnly)&&!g.used.includes(e.id)&&(!e.when||e.when(g)));
  return pool.length?weightedPick(pool,evWeight(g)):null;
}

/* 禁断の秘術（ダイジョーブ博士枠） */
function gamble(g,o){
  const r=Math.random();
  if(r<o.great){add(g,{atk:12,def:12,mob:12,pow:12});prog(g,'kakusei');return '大成功! 国そのものが覚醒した。'}
  if(r<o.great+o.ok){const ks=[...STAT_KEYS].sort(()=>Math.random()-.5).slice(0,2);add(g,{[ks[0]]:15,[ks[1]]:15});return `成功。${LABEL[ks[0]]}と${LABEL[ks[1]]}が大きく伸びた。`}
  if(r<o.great+o.ok+o.fail){add(g,{atk:-8,def:-8,mob:-8,pow:-8,morale:-10});return '失敗……。国中に混乱が広がった。'}
  add(g,{atk:25,def:-20});prog(g,'boso');return '暴走! 軍勢は猛り狂い、守りを顧みなくなった。';
}
const ODDS_GENIUS={great:.2,ok:.35,fail:.25};
const ODDS_ALCH={great:.12,ok:.28,fail:.32};

function nationScore(g){
  const tiers=g.specials.map(id=>SPECIALS[id].tier);
  return STAT_KEYS.reduce((a,k)=>a+g.s[k],0)+tiers.filter(t=>t==='gold').length*15+tiers.filter(t=>t==='blue').length*6-tiers.filter(t=>t==='red').length*5;
}
function nationRank(g){
  const sc=nationScore(g);
  return sc>=330?'S':sc>=290?'A':sc>=255?'B':sc>=220?'C':sc>=185?'D':sc>=150?'E':'F';
}
const goldCount=g=>g.specials.filter(id=>SPECIALS[id].tier==='gold').length;
function finalize(g){checkSpecials(g);g.type=computeType(g.s);g.rank=nationRank(g);g.done=true}

/* NPCの国（同じ規則で、ランダムに育てる） */
function genNPC(o={}){
  const ans=o.ans||QUESTIONS.map(q=>Math.floor(Math.random()*q.opts.length));
  const g=buildFromAnswers(ans);
  g.name=o.name||genName(g,o.suffix); g.flag=genFlag(g);
  const keys=['arms','fortify','trade','farm'],fav=pick(keys),turns=o.turns||10;
  for(g.turn=1;g.turn<=turns;g.turn++){
    if(g.morale<35) npcCommand(g,'fest');
    else {const ws=keys.map(k=>(g.mult[k]||1)*(k===fav?1.5:1)*(.5+Math.random()));npcCommand(g,keys[ws.indexOf(Math.max(...ws))])}
    checkSpecials(g);
    if(g.turn===8){if(roll(.4))gamble(g,ODDS_ALCH)}
    else{const ev=pickRandomEvent(g,false);if(ev){pick(ev.choices).run(g);g.used.push(ev.id)}}
    checkSpecials(g);
  }
  g.turn=turns;
  for(const k of STAT_KEYS) g.s[k]=clamp(Math.round(g.s[k]*(o.factor||1)),1,100);
  finalize(g);
  return g;
}

}

};
const STAT_WORD={atk:'攻め',def:'守り',mob:'機動',pow:'国力'};
function drawCards(g){
  const out=[],ids=Object.keys(CARDS),ws=ids.map(id=>{const w=CARDS[id].w;return typeof w==='function'?w(g):w});
  while(out.length<3){
    let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<ids.length-1;i++){r-=ws[i];if(r<=0)break}
    if(ws[i]>0){out.push(ids[i]);ws[i]=0}
  }
  return out;
}
function cardHint(g,id){
  const c=CARDS[id],parts=[];
  if(c.kind==='fest') parts.push('民心↑↑');
  else if(c.kind==='school') parts.push('民心↑','人が育つ');
  else{
    for(const k in c.d) parts.push(STAT_WORD[k]+(c.d[k]>=9?'↑↑':'↑'));
    const cost=Math.round(c.cost*g.costMult);
    parts.push('民の疲れ '+(cost<=3?'小':cost<=7?'中':'大'));
    if(c.kind===g.lastKind) parts.push('続けると伸びる');
  }
  if(g.built.includes(id)) parts.push('増築');
  return parts.join(' · ');
}
function applyCard(g,id){
  const c=CARDS[id];
  plant(g,id); if(!g.built.includes(id)) g.built.push(id);
  if(c.kind==='fest'){g.cnt.fest++;add(g,{morale:28,pow:2});g.lastKind='fest';return {title:c.title,text:c.done}}
  if(c.kind==='school'){add(g,{morale:8,pow:2});g.lastKind='school';return {title:c.title,text:c.done}}
  if(roll(failChance(g))){add(g,{morale:-5});g.lastKind=null;return {title:c.title,text:'民が従わず、工事は途中で止まった。'}}
  const streak=g.lastKind===c.kind,hot=g.morale>=80;
  const m=(g.mult[c.kind]||1)*(hot?1.2:1)*(streak?1.15:1);
  const d={};for(const k in c.d) d[k]=Math.max(1,Math.round(c.d[k]*m*(.9+Math.random()*.25)));
  add(g,d);add(g,{morale:-Math.round(c.cost*g.costMult)-(streak?4:0)});
  g.cnt[c.kind]++;g.lastKind=c.kind;
  return {title:c.title,text:(streak?'続けて取り組み、手際が良くなった。':'')+(hot?'民の士気が高く、はかどった。':'')+c.done};
}

const ALL_EVENTS=Object.fromEntries([...CALLBACKS,...TRAITS,...EVENTS.map(e=>({...e,scene:SCENE_OF[e.id]||{}})),BANDIT,GENIUS,ALCHEMIST].map(e=>[e.id,e]));

function cbReady(g,e){
  if(g.used.includes(e.id)) return false;
  if(!e.need.every(k=>g.seeds[k])) return false;
  if((e.block||[]).some(k=>g.seeds[k])) return false;
  return g.turn-g.seeds[e.need[0]].t>=e.gap;
}
/* そのターンに起きる出来事を1つ決める。伏線が熟していれば、それを最優先にする */
function nextEvent(g){
  const t=g.turn;
  if(t===10) return null;
  if(t===2) return 'sanzoku';
  if(t===8) return g.seeds.genius?'genius':'alchemist';
  const cb=CALLBACKS.filter(e=>cbReady(g,e));
  if(cb.length){
    const oldest=Math.min(...cb.map(e=>g.seeds[e.need[0]].t));
    return weightedPick(cb.filter(e=>g.seeds[e.need[0]].t===oldest),e=>e.w||3).id;
  }
  const tr=TRAITS.filter(e=>!g.used.includes(e.id)&&e.when(g));
  if(tr.length&&roll(.75)) return weightedPick(tr,e=>e.w||3).id;
  const ge=pickRandomEvent(g,true);
  return ge?ge.id:null;
}
function getEvent(id){return ALL_EVENTS[id]}
function eventCause(g,ev){return ev.need&&g.seeds[ev.need[0]]?causeOf(g,ev.need[0])+'ことから':null}

function withDelta(g,fn){
  const b=snap(g),sp=[...g.specials];const r=fn();checkSpecials(g);
  r.d=diff(b,snap(g));r.got=g.specials.filter(x=>!sp.includes(x));return r;
}
const playCard=(g,id)=>withDelta(g,()=>applyCard(g,id));
function playEvent(g,id,i){
  return withDelta(g,()=>{
    const ev=getEvent(id),ch=ev.choices[i],before=Object.keys(g.seeds);
    const cause=eventCause(g,ev);
    g.used.push(id);
    const text=ch.run(g);
    const planted=Object.keys(g.seeds).filter(k=>!before.includes(k));
    if(ev.need) g.links.push({from:ev.need[0],y:yearOf(g.turn),title:ev.title,choice:ch.label,planted});
    return {title:`${ev.title} · ${ch.label}`,text,cause};
  });
}

/* 治世の中の戦い */
function battleKindAt(g){
  const t=g.turn,done=k=>g.battles.some(b=>b.kind===k);
  if(t===4&&g.seeds.bandit_war&&!done('bandit')) return 'bandit';
  if(t===7&&!done('invade')) return 'invade';
  if(t===10&&!done('final')) return 'final';
  return null;
}
function battleSetup(g,kind){
  if(kind==='bandit'){
    const o=genNPC({turns:3,factor:.8,name:'山賊団「黒狼」'});
    return {kind,opp:o,field:pick(Object.keys(FIELDS)),label:'山賊団の討伐',intro:'山賊団「黒狼」の隠れ家を突き止めた。いよいよ討伐の時だ。'};
  }
  if(kind==='invade'){
    const o=genNPC({turns:6,factor:.95});
    return {kind,opp:o,field:pick(Object.keys(FIELDS)),label:`${o.name}の侵攻`,intro:`西の${o.name}が、国境を越えて攻め込んできた。`};
  }
  const o=genNPC({turns:10,factor:1.07,suffix:'帝国'});
  const homes=Object.keys(FIELDS).filter(k=>FIELDS[k].home(g));
  return {kind,opp:o,field:homes.length&&roll(.5)?pick(homes):pick(Object.keys(FIELDS)),label:`${o.name}との決戦`,
    intro:`大陸の東で膨れ上がった${o.name}が、すべての国に臣従を迫ってきた。国の存亡を賭けた戦いが始まる。`};
}
/* これまでの選択が、戦いでどう効くか */
function battleMods(g,kind){
  const S=g.seeds,p={all:1,atk:1,def:1,crit:0,surprise:false,notes:[]},e={all:1,notes:[]};
  const note=(side,k,effect)=>side.notes.push({seed:k,text:`${causeOf(g,k)}ことで、${effect}`,effect});
  if(S.fort){p.def*=1.12;note(p,'fort','砦が敵の足を止めた')}
  if(S.wall){p.def*=1.06;note(p,'wall','城下は一度も破られなかった')}
  if(S.scouted&&kind!=='bandit'){p.surprise=true;note(p,'scouted','先手を取れた')}
  else if(S.watch&&kind!=='bandit'){p.surprise=true;note(p,'watch','敵の動きが筒抜けだった')}
  if(kind!=='bandit'){
    if(S.bandit_guard){p.all*=1.08;note(p,'bandit_guard','元山賊たちが抜け道から敵の背後を突いた')}
    else if(S.bandit_ally){p.all*=1.05;note(p,'bandit_ally','元山賊たちが駆けつけた')}
    if(S.knights_honor){p.crit+=.04;note(p,'knights_honor','規律ある騎士団が乱れずに突撃した')}
    if(S.knights_arrogant){p.all*=.95;note(p,'knights_arrogant','騎士たちは王の命令に従わなかった')}
  }
  if(kind==='invade'&&S.fort_vet){p.def*=1.05;note(p,'fort_vet','砦の兵は落ち着いていた')}
  if(kind==='final'){
    if(S.merc){p.atk*=1.08;note(p,'merc','あの傭兵たちが約束どおり駆けつけた')}
    if(S.gratitude){p.all*=1.1;note(p,'gratitude','隣国が恩を返しに援軍を送ってきた')}
    if(S.resentment){e.all*=1.08;note(e,'resentment','恨みを抱いた隣国が、帝国の側についた')}
    if(S.migrants){p.def*=1.05;note(p,'migrants','迎え入れた人々が城を守った')}
    if(S.song){p.all*=1.04;note(p,'song','兵たちは国の歌を歌いながら戦った')}
  }
  return {p,e};
}
const KIND_LABEL={bandit:'山賊団の討伐',invade:'侵攻',final:'決戦'};
function battleOutcome(g,kind,win,opp,mods){
  g.battles.push({kind,win,name:opp.name});
  for(const n of [...mods.p.notes,...mods.e.notes]) g.links.push({from:n.seed,y:yearOf(g.turn),title:KIND_LABEL[kind],choice:n.effect,planted:[]});
  if(kind==='bandit'){
    if(win){plant(g,'bandit_beaten');add(g,{pow:6,morale:6});return {title:'山賊団の討伐 · 勝利',text:'山賊団を討ち果たした。街道に平和が戻った。'}}
    add(g,{pow:-6,morale:-8});return {title:'山賊団の討伐 · 敗北',text:'山賊団を取り逃がした。街道の商人たちが不安がっている。'};
  }
  if(kind==='invade'){
    if(win){add(g,{atk:4,morale:10});return {title:`${opp.name}の侵攻 · 勝利`,text:`${opp.name}の軍を国境の外へ押し返した。`}}
    add(g,{pow:-10,morale:-10,def:-4});return {title:`${opp.name}の侵攻 · 敗北`,text:`国境の村々を${opp.name}に奪われた。`};
  }
  return {title:win?'決戦 · 勝利':'決戦 · 敗北',text:win?`${opp.name}の軍旗が、ゆっくりと下ろされた。`:'あなたの軍は、ついに崩れた。'};
}
const playOutcome=(g,kind,win,opp,mods)=>withDelta(g,()=>battleOutcome(g,kind,win,opp,mods));

/* 結末：国の呼び名は、その国が積み重ねたものから決まる */
const EPITHET=[['iryo','医術'],['gratitude','慈悲'],['castaway','恩義'],['port','港'],['fort','砦'],['song','歌'],['knights','騎士'],['smith','鋼'],['farm','実り'],['school','学び'],['market','市'],['bandit_ally','寛容'],['mill','水車'],['watch','物見'],['road','街道'],['wall','石壁'],['fest','祭り'],['hunt','弓'],['resentment','商魂']];
function endingOf(g){
  const fin=g.battles.find(b=>b.kind==='final'),won=!!(fin&&fin.win);
  const tagOf=Object.fromEntries(EPITHET),ok=k=>(g.seeds[k]||g.specials.includes(k))&&!(k==='port'&&g.seeds.port_closed);
  const tags=[...new Set([...chains(g).map(c=>tagOf[c.root]).filter(Boolean),...EPITHET.filter(([k])=>ok(k)).map(x=>x[1])])].slice(0,2);
  const epithet=tags.length===2?`${tags[0]}と${tags[1]}の国`:tags.length?`${tags[0]}の国`:'名もなき国';
  let v;
  if(!won) v={title:'滅びた国',line:'帝国の大軍に飲み込まれ、その名は歴史の陰に消えた'};
  else if(STAT_KEYS.every(k=>g.s[k]>=80)&&goldCount(g)>=2) v={title:'伝説の国',line:'帝国を打ち破り、大陸の伝説になった'};
  else if(g.morale<25||g.specials.includes('akumyo')) v={title:'恐れられた国',line:'帝国を退けたが、大陸の国々から恐れられた'};
  else if(g.morale>=60) v={title:'愛された国',line:'帝国を退け、民に愛される国として栄えた'};
  else v={title:'不屈の国',line:'帝国を退け、大陸にその名を刻んだ'};
  return {...v,epithet};
}
const closingLine=(g,e)=>`${landPhrase(g)}に生まれた${g.name}は、「${e.epithet}」と呼ばれ、${e.line}。`;
/* 選択のつながりを、きっかけの選択ごとにまとめる */
function chains(g){
  const roots=[...new Set(g.links.map(L=>L.from))].filter(k=>!g.links.some(L=>L.planted.includes(k)));
  return roots.map(root=>{
    const seeds=new Set([root]),nodes=[];
    for(const L of g.links) if(seeds.has(L.from)){nodes.push(L);L.planted.forEach(k=>seeds.add(k))}
    const seen=new Set(),out=[{y:yearOf(g.seeds[root].t),text:SEED_LABEL[root]}];
    for(const L of nodes.sort((a,b)=>a.y-b.y)){const t=`${L.title}: ${L.choice}`;if(!seen.has(t)){seen.add(t);out.push({y:L.y,text:t})}}
    out.root=root;return out;
  }).sort((a,b)=>b.length-a.length);
}

/* 国名と国旗 */
const NAME_HEAD={寒冷:['ノル','ヴァル','スヴェ','フロ','イス','カレ','ユル','オルド'],温暖:['ミラ','セレ','アウ','ルミ','オリ','フィオ','エメ','ソラ'],乾燥:['ザル','カシ','タム','サハ','オア','ハル','ジン','ラザ'],熱帯:['マナ','ココ','タヒ','パル','ルア','キナ','モア','ナル']};
const NAME_MID=['ン','ラ','ド','ス','リ','ネ','ガ','ト','ヴィ','ル','メ','ロ'];
const NAME_END=['ア','ス','ン','ド','ル','ナ','ム','タ','リア','ニア'];
const SUFFIX={自由:'共和国',調和:'連邦',挑戦:'公国',伝統:'王国'};
function genName(g,suffix){
  const head=pick(NAME_HEAD[g.answers.climate]||NAME_HEAD['温暖']);
  const base=head+(roll(.55)?pick(NAME_MID):'')+pick(NAME_END);
  return base+(suffix||(has(g,'島')?'諸島国':SUFFIX[g.answers.motto]||'王国'));
}
const KING_NAMES=['エルン','リアム','セリス','アルド','ユーリ','カイ','ミレア','ロウェン'];
const PAL={寒冷:{c:['#1F3F73','#F1F4F7','#86AEDD'],team:'#3D6FC8',alt:'#7A5BC0'},温暖:{c:['#2D7A4E','#F2CF55','#F7F6EC'],team:'#2F9763',alt:'#8B9C1C'},乾燥:{c:['#B04F28','#E8C266','#3A2A1F'],team:'#CF6430',alt:'#A2405F'},熱帯:{c:['#0D8686','#F0892A','#FFF4DC'],team:'#13A3A3',alt:'#E07A1F'}};
function genFlag(g){return {climate:g.answers.climate||'温暖',motto:g.answers.motto||'伝統',res:g.answers.resource||'農作物',big:g.answers.population==='大集団'}}
function flagSVG(f,w=60,h=40){
  const [a,b,c]=(PAL[f.climate]||PAL['温暖']).c;
  let bg,em=b,st='none';
  if(f.motto==='自由'){bg=`<rect width="20" height="40" fill="${a}"/><rect x="20" width="20" height="40" fill="${c}"/><rect x="40" width="20" height="40" fill="${b}"/>`;em=a}
  else if(f.motto==='調和'){bg=`<rect width="60" height="20" fill="${a}"/><rect y="20" width="60" height="20" fill="${c}"/>`;st=a}
  else if(f.motto==='挑戦'){bg=`<rect width="60" height="40" fill="${c}"/><path d="M0 0H60L0 40Z" fill="${a}"/>`;st=a}
  else {bg=`<rect width="60" height="40" fill="${a}"/><circle cx="30" cy="20" r="13" fill="${c}"/>`;em=a}
  const s=f.big?9.5:7.5,cx=30,cy=20;let shape;
  if(f.res==='鉱物') shape=`<path d="M${cx} ${cy-s*1.3}L${cx+s} ${cy}L${cx} ${cy+s*1.3}L${cx-s} ${cy}Z"/>`;
  else if(f.res==='農作物') shape=`<circle cx="${cx}" cy="${cy}" r="${s}"/>`;
  else if(f.res==='漁業') shape=`<path d="M${cx+s*.25} ${cy-s}A${s} ${s} 0 1 0 ${cx+s*.25} ${cy+s}A${s*1.25} ${s*1.25} 0 0 1 ${cx+s*.25} ${cy-s}Z"/>`;
  else {let p='';for(let i=0;i<16;i++){const r=i%2?s*.58:s,an=Math.PI*i/8-Math.PI/2;p+=(i?'L':'M')+(cx+r*Math.cos(an)).toFixed(2)+' '+(cy+r*Math.sin(an)).toFixed(2)}shape=`<path d="${p}Z"/>`}
  return `<svg class="flag" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="${w}" height="${h}" role="img" aria-label="国旗">${bg}<g fill="${em}" stroke="${st}" stroke-width="1.2">${shape}</g></svg>`;
}

/* 戦闘（決定的なシミュレーション。乱数の種が同じなら結果も同じ） */
const FIELDS={
 plain:{name:'平野',home:g=>has(g,'平野'),c:'f-plain'},
 mount:{name:'山岳',home:g=>has(g,'山岳'),c:'f-mount'},
 sea:{name:'海峡',home:g=>has(g,'海')||has(g,'島'),c:'f-sea'},
 snow:{name:'雪原',home:g=>has(g,'寒冷'),c:'f-snow'},
 sand:{name:'砂漠',home:g=>has(g,'乾燥'),c:'f-sand'},
};
const TACTICS={
 rush:{name:'速攻',desc:'序盤の攻めが強い。疲れやすい'},
 guard:{name:'堅守',desc:'守りが固い。攻めは控えめ'},
 endure:{name:'持久',desc:'疲れにくい。攻めはやや控えめ'},
};
const MAX_TICKS=40;
function simulate(P,E,fieldKey,tP,tE,seed,ext={p:{},e:{}}){
  const rng=mulberry32(seed),field=FIELDS[fieldKey];
  const mk=(c,opp,tactic,x={})=>{
    const sp=c.specials,home=field.home(c);let all=x.all||1;
    if(home) all*=sp.includes('chinori')?1.22:1.1;
    if(sp.includes('kakusei')) all*=1.15;
    const ta=adv(c.type,opp.type); if(ta===1) all*=1.15; else if(ta===-1) all*=.9;
    let decay=Math.max(.6,3.3-c.s.pow/45);
    if(sp.includes('heitan')) decay*=.65; if(sp.includes('iryo')) decay*=.8; if(sp.includes('naifun')) decay*=1.3;
    if(tactic==='rush') decay*=1.3; if(tactic==='endure') decay*=.7;
    return {c,sp,home,all,ta,tactic,stam:100,decay,
      crit:Math.max(.01,.04+c.s.mob/650+(sp.includes('meisho')?.08:0)+(sp.includes('kaiyo')&&fieldKey==='sea'?.06:0)+(x.crit||0)),
      critMult:sp.includes('meisho')?2.1:1.7,rallied:false,tired:false,fired:[],atkM:x.atk||1,defM:x.def||1,surprise:!!x.surprise,notes:x.notes||[]};
  };
  const A=mk(P,E,tP,ext.p),B=mk(E,P,tE,ext.e);
  const logs=[];let t=0;
  const side=X=>X===A?'p':'e';
  const fire=(X,id)=>{if(!X.fired.includes(id)){X.fired.push(id);logs.push({t,who:side(X),text:`${X.c.name}: ${SPECIALS[id].battle}`})}};
  logs.push({t:0,who:'n',text:`開戦。戦場は${field.name}。`});
  if(A.home) logs.push({t:0,who:'p',text:`${P.name}にとって${field.name}は地元の地形だ`});
  if(B.home) logs.push({t:0,who:'e',text:`${E.name}にとって${field.name}は地元の地形だ`});
  for(const X of [A,B]) for(const n of X.notes) logs.push({t:0,who:side(X),text:n.text});
  let f=0;
  for(const X of [A,B]){
    if(X.sp.includes('gaiko')){f+=X===A?12:-12;fire(X,'gaiko')}
    if(X.sp.includes('chinori')&&X.home) fire(X,'chinori');
    if(X.sp.includes('kakusei')) fire(X,'kakusei');
    if(X.sp.includes('boso')) fire(X,'boso');
  }
  const ticks=[{f,sp:100,se:100,net:0,crit:null}];
  let lastCrit=-9,crossP=false,crossE=false,end=null;
  for(t=0;t<MAX_TICKS;t++){
    const power=(X,Y)=>{
      const eff=.45+.55*X.stam/100;
      let atk=X.c.s.atk*X.all*eff*X.atkM,def=X.c.s.def*X.all*eff*X.defM;
      if(X.tactic==='rush'&&t<12) atk*=1.25;
      if(X.tactic==='guard'){def*=1.25;atk*=.9}
      if(X.tactic==='endure') atk*=.95;
      if(X.sp.includes('kiba')&&t<5){atk*=1.45;fire(X,'kiba')}
      if(X.sp.includes('totsugeki')&&t<6){atk*=1.35;fire(X,'totsugeki')}
      if(X.sp.includes('ogon')&&t>=20){atk*=1.15;def*=1.15;fire(X,'ogon')}
      if(X.sp.includes('boso')){atk*=1.35;def*=.6}
      if(Y.sp.includes('akumyo')){atk*=1.1;fire(Y,'akumyo')}
      if(X.sp.includes('kaiyo')&&fieldKey==='sea'){atk*=1.15;fire(X,'kaiyo')}
      const pushedBack=X===A?f<-50:f>50;
      if(X.sp.includes('tekiheki')&&pushedBack){def*=1.4;fire(X,'tekiheki')}
      if(Y.sp.includes('kishu')&&t<4){def*=.7;fire(Y,'kishu')}
      if(Y.surprise&&t<4) def*=.78;
      if(t<3&&X.c.s.mob>Y.c.s.mob) atk*=1+(X.c.s.mob-Y.c.s.mob)/200;
      return {atk,def};
    };
    if(t===15) for(const X of [A,B]) if(X.sp.includes('naifun')) fire(X,'naifun');
    if(t===20) for(const X of [A,B]){if(X.sp.includes('heitan')) fire(X,'heitan');if(X.sp.includes('iryo')) fire(X,'iryo')}
    const a=power(A,B),b=power(B,A);
    let ra=.8+rng()*.4,rb=.8+rng()*.4,crit=null;
    if(rng()<A.crit){ra*=A.critMult;crit='p'}
    if(rng()<B.crit){rb*=B.critMult;crit=crit?'both':'e'}
    if(crit&&t-lastCrit>=4){
      lastCrit=t;
      const X=crit==='e'?B:A;
      if(X.sp.includes('meisho')&&!X.fired.includes('meisho')) fire(X,'meisho');
      else logs.push({t:t+1,who:side(X),text:`${X.c.name}の会心の一撃!`});
    }
    const pa=Math.max(1.5,a.atk*ra-b.def*.55),pb=Math.max(1.5,b.atk*rb-a.def*.55);
    const net=(pa-pb)*.22; f+=net;
    A.stam=Math.max(0,A.stam-A.decay);B.stam=Math.max(0,B.stam-B.decay);
    if(f<=-85&&A.sp.includes('fukutsu')&&!A.rallied){A.rallied=true;f+=28;A.stam=Math.min(100,A.stam+30);t++;fire(A,'fukutsu');t--}
    if(f>=85&&B.sp.includes('fukutsu')&&!B.rallied){B.rallied=true;f-=28;B.stam=Math.min(100,B.stam+30);t++;fire(B,'fukutsu');t--}
    f=clamp(f,-100,100);
    ticks.push({f,sp:A.stam,se:B.stam,net,crit});
    for(const X of [A,B]) if(!X.tired&&X.stam<25){X.tired=true;logs.push({t:t+1,who:side(X),text:`${X.c.name}の兵が息切れしてきた`})}
    if(!crossP&&f>=50){crossP=true;logs.push({t:t+1,who:'p',text:`${P.name}が大きく押し込む`})}
    if(!crossE&&f<=-50){crossE=true;logs.push({t:t+1,who:'e',text:`${E.name}が攻め込んでくる`})}
    if(f>=100){end={winner:'p',how:'push'};break}
    if(f<=-100){end={winner:'e',how:'push'};break}
  }
  const T=ticks.length-1;
  if(!end) end={winner:f>0?'p':'e',how:'judge'};
  const W=end.winner==='p'?P:E;
  logs.push({t:T,who:'n',text:end.how==='push'?`${W.name}が押し切った!`:`時間切れ。押し込んでいた${W.name}の判定勝ち。`});
  logs.sort((x,y)=>x.t-y.t);

  /* 勝敗の解説 */
  const reasons=[];
  if(A.ta===1) reasons.push(`相性: ${TYPES[P.type].name}は${TYPES[E.type].name}に強い(あなたが有利)`);
  else if(A.ta===-1) reasons.push(`相性: ${TYPES[E.type].name}は${TYPES[P.type].name}に強い(相手が有利)`);
  else reasons.push(`相性: どちらも${TYPES[P.type].name}で、相性の差はなし`);
  if(A.home||B.home) reasons.push(`戦場: ${field.name}は${A.home&&B.home?'両国':A.home?'あなた':'相手'}の地元の地形`);
  else reasons.push(`戦場: ${field.name}はどちらの地元でもない`);
  reasons.push(`作戦: あなたは${TACTICS[tP].name}、相手は${TACTICS[tE].name}`);
  let best=null;
  for(const k of STAT_KEYS){const d=P.s[k]-E.s[k];if(!best||Math.abs(d)>Math.abs(best.d))best={k,d}}
  if(best&&Math.abs(best.d)>=8) reasons.push(`能力: ${LABEL[best.k]}が ${rankOf(P.s[best.k])} 対 ${rankOf(E.s[best.k])}`);
  const last=ticks[T];
  if(Math.abs(last.sp-last.se)>=20) reasons.push(`持久: ${last.sp>last.se?'あなた':'相手'}の兵が最後まで粘った(国力と作戦の差)`);
  const firedNames=X=>X.fired.map(id=>SPECIALS[id].name);
  if(A.fired.length) reasons.push(`あなたの特技: ${firedNames(A).join('、')}`);
  if(B.fired.length) reasons.push(`相手の特技: ${firedNames(B).join('、')}`);
  return {ticks,logs,end,reasons,field:fieldKey,tE};
}
</script>

<script>
'use strict';
/* ===== 挿絵（その国の土地に、選んだ事業の建物が増えていく） ===== */
let SVG_UID=0;
const ART={
 寒冷:{sky:['#A9C1D6','#E6EDF2'],far:'#7F94AA',far2:'#A4B5C6',ground:'#E2E9ED',ground2:'#C7D3DB',water:'#5A82A4',water2:'#82A4C0',roof:'#3D5672',tree:'#4C6A5C'},
 温暖:{sky:['#8CC3E6','#E3F2F9'],far:'#6D9E7B',far2:'#93BE8F',ground:'#A9D085',ground2:'#8DBE6C',water:'#3E8EC2',water2:'#6CACD4',roof:'#B4523B',tree:'#3D784A'},
 乾燥:{sky:['#E7C185','#F6E6C4'],far:'#BD8659',far2:'#D6A676',ground:'#E6C98F',ground2:'#D3AE72',water:'#4C9AAE',water2:'#78B7C5',roof:'#8C4A2F',tree:'#7A8A48'},
 熱帯:{sky:['#6CC1D5','#DCF3F1'],far:'#2F8B6D',far2:'#4CA97F',ground:'#6EBF6B',ground2:'#52A95C',water:'#1F9EAF',water2:'#4EC1CA',roof:'#CF6A2C',tree:'#226E49'},
};
const MOOD_SKY={dark:['#5B626C','#A0A6AD'],dusk:['#3E3966','#E8A270'],night:['#16223B','#3E5078'],war:['#7E5049','#D9B09A'],gold:['#E8B45A','#F8E3B2'],cold:['#B6C6D4','#EEF2F5']};
const MOOD_SHADE={dark:'rgba(30,34,44,.22)',night:'rgba(8,16,36,.42)',dusk:'rgba(60,30,60,.16)',war:'rgba(110,30,20,.12)',gold:'rgba(255,190,90,.10)'};
const STONE='#C3BCAF',STONE2='#8E877C',WOOD='#7A5638',INK='#2A2E37',CLOTH='#F4EFE5',ENEMY='#9B2F29',GOLDC='#F2C14E';
function strHash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* 建物の位置（地形で変わるものだけ分ける） */
function slotOf(g,id){
  const T=g.answers.terrain,coast=T==='海'||T==='島';
  const S={castle:[160,108],fort:[48,98],watch:[104,98],smith:[208,118],school:[120,126],market:[194,148],
    mill:coast?[86,142]:[262,128],hunt:[60,134],farm:[104,160],road:[160,150],wall:[160,100],knights:[160,112],fest:[200,150],
    port:T==='海'?[238,140]:T==='島'?[278,146]:[276,150]};
  return S[id];
}
const person=(x,y,c=INK,k=1)=>`<g fill="${c}"><circle cx="${x}" cy="${y-9*k}" r="${2.4*k}"/><path d="M${x-3*k} ${y}L${x-2*k} ${y-6*k}L${x+2*k} ${y-6*k}L${x+3*k} ${y}Z"/></g>`;
function tower(x,y,w,h,c=STONE,c2=STONE2){
  let s=`<rect x="${x-w/2}" y="${y-h}" width="${w}" height="${h}" fill="${c}"/><rect x="${x-w/2}" y="${y-h}" width="${w}" height="${h}" fill="none" stroke="${c2}" stroke-width=".8"/>`;
  for(let i=0;i<3;i++) s+=`<rect x="${x-w/2+i*(w/3)+w/12}" y="${y-h-3}" width="${w/6}" height="3" fill="${c}"/>`;
  return s;
}
function drawBuilding(g,id,P,lit){
  const [x,y]=slotOf(g,id),win=lit?GOLDC:'#3C3F48';
  switch(id){
   case 'fort': return `<path d="M${x-30} ${y+4}Q${x} ${y-14} ${x+30} ${y+4}Z" fill="${P.ground2}"/>${tower(x,y,14,22)}<rect x="${x-2}" y="${y-14}" width="4" height="5" fill="${win}"/><line x1="${x}" y1="${y-25}" x2="${x}" y2="${y-34}" stroke="${INK}" stroke-width="1"/><path d="M${x} ${y-34}L${x+8} ${y-31}L${x} ${y-28}Z" fill="${(PAL[g.answers.climate]||PAL['温暖']).c[0]}"/>`;
   case 'watch': return `<rect x="${x-3}" y="${y-30}" width="6" height="30" fill="${WOOD}"/><path d="M${x-7} ${y-30}L${x} ${y-38}L${x+7} ${y-30}Z" fill="${P.roof}"/><rect x="${x-5}" y="${y-30}" width="10" height="3" fill="${STONE2}"/><circle cx="${x}" cy="${y-24}" r="1.4" fill="${win}"/>`;
   case 'smith': return `<rect x="${x-11}" y="${y-10}" width="22" height="10" fill="${WOOD}"/><path d="M${x-13} ${y-10}L${x} ${y-18}L${x+13} ${y-10}Z" fill="${P.roof}"/><rect x="${x+5}" y="${y-22}" width="4" height="8" fill="${STONE2}"/><g fill="#9AA0A8" opacity=".7"><circle cx="${x+8}" cy="${y-26}" r="3"/><circle cx="${x+11}" cy="${y-32}" r="4"/><circle cx="${x+15}" cy="${y-39}" r="5"/></g><rect x="${x-6}" y="${y-6}" width="5" height="6" fill="#E8752F"/>`;

function sceneSVG(g,sc={},opt={}){
  const P=ART[g.answers.climate]||ART['温暖'],T=g.answers.terrain,id=++SVG_UID;
  const sky=MOOD_SKY[sc.mood]||P.sky,lit=sc.mood==='night'||sc.mood==='dusk';
  const r=mulberry32(strHash(g.name||'x'));
  let s=`<defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="320" height="180" fill="url(#sk${id})"/>`;
  if(sc.mood==='night') s+=`<circle cx="270" cy="30" r="9" fill="#F4F1DE"/>`;
  else if(sc.mood!=='dark'&&sc.over!=='drought') s+=`<circle cx="${50+r()*40}" cy="${26+r()*10}" r="10" fill="#FFF6D8" opacity=".9"/>`;
  /* 遠景 */
  if(T==='山岳'){
    for(const row of [0,1]){for(let i=0;i<5;i++){const x=-10+i*76+r()*26+row*30,py=26+r()*20+row*14,c=row?P.far:P.far2;
      s+=`<path d="M${x-58} 98L${x} ${py}L${x+58} 98Z" fill="${c}"/>`;
      if(has(g,'寒冷')||row===0) s+=`<path d="M${x-12} ${py+(98-py)*.2}L${x} ${py}L${x+12} ${py+(98-py)*.2}L${x+5} ${py+(98-py)*.16}L${x} ${py+(98-py)*.24}L${x-5} ${py+(98-py)*.16}Z" fill="#F4F7F9" opacity=".95"/>`}}
  } else if(T==='平野'){
    s+=`<path d="M0 90Q70 72 150 86T320 80V100H0Z" fill="${P.far2}"/><path d="M0 96Q90 84 190 94T320 92V102H0Z" fill="${P.far}"/>`;
  } else {
    s+=`<path d="M0 90Q30 80 70 88L90 92H0Z" fill="${P.far2}"/>`;
  }
  /* 水と大地 */
  if(T==='海'){
    s+=`<rect y="88" width="320" height="18" fill="${P.water2}"/><path d="M0 100L214 104Q236 122 242 180H0Z" fill="${P.ground}"/><path d="M214 104Q236 122 242 180H320V104Z" fill="${P.water}"/>`;
  } else if(T==='島'){
    s+=`<rect y="88" width="320" height="92" fill="${P.water}"/><rect y="88" width="320" height="10" fill="${P.water2}"/><path d="M40 138Q55 100 160 98Q265 100 280 138Q270 172 160 174Q50 172 40 138Z" fill="${P.ground}"/>`;
  } else {
    s+=`<rect y="96" width="320" height="84" fill="${P.ground}"/><path d="M296 96Q268 122 282 142T262 180H276Q290 150 296 130T310 96Z" fill="${P.water}"/>`;
  }
  for(let i=0;i<7;i++){const x=40+r()*240,y=118+r()*50;s+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(10+r()*16).toFixed(0)}" ry="2.4" fill="${P.ground2}" opacity=".8"/>`}
  if(has(g,'熱帯')) [[22,120],[300,108]].forEach(([x,y])=>{if(T==='島'&&x<40)return;s+=`<path d="M${x} ${y}Q${x+2} ${y-12} ${x} ${y-22}" stroke="${WOOD}" stroke-width="2" fill="none"/><path d="M${x} ${y-22}Q${x-10} ${y-24} ${x-14} ${y-16}M${x} ${y-22}Q${x+10} ${y-24} ${x+14} ${y-16}M${x} ${y-22}Q${x-6} ${y-30} ${x-12} ${y-30}M${x} ${y-22}Q${x+6} ${y-30} ${x+12} ${y-30}" stroke="${P.tree}" stroke-width="2.4" fill="none"/>`});
  /* 建物 */
  const ids=[...g.built];if(sc.preview&&!ids.includes(sc.preview)) ids.push(sc.preview);
  const order=['road','farm','fort','watch','hunt','wall','mill','smith','school','market','knights','fest','port'];
  const hl=sc.preview||sc.focus;
  for(const b of order){
    if(!ids.includes(b)) continue;
    if(b===hl&&!opt.crop){const [x,y]=slotOf(g,b);s+=`<circle cx="${x}" cy="${y-10}" r="20" fill="#FFF3C4" opacity=".45"/>`}
    if(b==='wall') continue;
    s+=drawBuilding(g,b,P,lit);
  }
  s+=castle(g,P,lit);
  if(ids.includes('wall')) s+=drawBuilding(g,'wall',P,lit);
  if(sc.prop) s+=drawProp(g,sc.prop,P);
  if(sc.over) s+=drawOver(sc.over,P);
  if(MOOD_SHADE[sc.mood]&&sc.mood!=='night') s+=`<rect width="320" height="180" fill="${MOOD_SHADE[sc.mood]}"/>`;
  if(sc.mood==='night') s+=`<rect y="96" width="320" height="84" fill="${MOOD_SHADE.night}"/>`;
  const vb=opt.crop?opt.crop.join(' '):'0 0 320 180';
  return `<svg class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${opt.label||'国の様子'}">${s}</svg>`;
}

function statsPanel(g,compact){

}
const MORALE_STATE=m=>m>=80?['熱狂(事業がはかどる)','good']:m>=60?['良好','good']:m>=40?['普通','muted']:m>=30?['不満','warn']:['危険(事業が失敗しやすい)','bad'];
function moraleRow(g){const [t,c]=MORALE_STATE(g.morale);return `<div class="morale" style="--c:var(--${c})"><span class="slabel">民心</span><span class="bar"><i style="width:${g.morale}%"></i></span><span class="mstate">${g.morale} ${t}</span></div>`}
const typeBadge=t=>`<span class="type" style="--c:var(--${TYPES[t].c})">${TYPES[t].name}</span>`;
const spChip=id=>`<span class="sp ${SPECIALS[id].tier}">${SPECIALS[id].name}</span>`;
function spList(ids){return ids.length?`<div class="splist">${ids.map(id=>`<div>${spChip(id)}<span class="small muted">${SPECIALS[id].desc}</span></div>`).join('')}</div>`:'<p class="small muted">特技なし</p>'}
function nationBand(g,sub){return `<div class="nation">${flagSVG(g.flag,54,36)}<div class="stack" style="gap:2px;min-width:0"><h2>${esc(g.name)}</h2>${sub||''}</div>${g.done?`<div class="bigrank rk-${g.rank}">${g.rank}<small>国家ランク</small></div>`:''}</div>`}
function chronList(items,scroll){return `<ol class="chron ${scroll?'scroll':''}">${items.map(c=>`<li><span class="y">${c.y}年</span><span>${esc(c.t)}</span></li>`).join('')}</ol>`}
function countryCard(g){
  return `${nationBand(g,`<div class="row" style="gap:8px">${typeBadge(g.type||computeType(g.s))}<span class="small muted">${esc(landPhrase(g))}</span></div>`)}
  ${statsPanel(g)}${spList(g.specials)}`;
}
const causeTag=c=>c?`<p class="cause">${esc(c)}</p>`:'';
function resultBlock(r){
  return `<section class="card res">${causeTag(r.cause)}<p class="eyebrow">${esc(r.title)}</p><p>${esc(r.text)}</p>${Object.keys(r.d||{}).length?`<div class="chips">${deltaChips(r.d)}</div>`:''}
  ${r.got&&r.got.length?`<div class="got"><p class="eyebrow">特技を身につけた</p>${spList(r.got)}</div>`:''}</section>`;
}
function chainList(cs){
  return cs.map(c=>`<ol class="chain">${c.map((n,i)=>`<li class="${i?'':'root'}"><span class="y">${n.y}年</span><span>${esc(n.text)}</span></li>`).join('')}</ol>`).join('');
}
const landMood=g=>g.morale<30?'dark':'';

/* 画面ごとの描画 */

  <section class="card"><p class="eyebrow">ある国の30年(例)</p>

    <p class="judge">潮風の入り江のセレナ連邦。「医術と港の国」と呼ばれた。</p>

  <section class="card"><h3>遊び方</h3><ol class="steps">

    <li><span><b>3度の戦いと、帝国との決戦</b><span class="small muted">過去の選択が戦いで効く。最後に、国の呼び名と、選択のつながりが残る。</span></span></li>
  </ol></section>
  ${hall.length?`<section class="card"><h3>これまでの国</h3><ul class="hall">${hall.slice(0,10).map(h=>`<li>${flagSVG(h.flag,36,24)}<span style="min-width:0"><b>${esc(h.name)}</b><span class="small muted"> 「${esc(h.epithet)}」 · ランク${h.rank}</span></span><span class="rec">${esc(h.title)}</span></li>`).join('')}</ul></section>`:''}`;
 },
 found(){

  return `<div class="qhead"><button class="link" data-act="back">← 戻る</button><span class="eyebrow">建国 ${q+1} / ${QUESTIONS.length}</span></div>

  ${q>=1?`<div class="frame">${sceneSVG(g,{mood:q>=2?'':'dusk'},{label:'見つけた土地'})}</div>`:''}
  <h2 class="q">${Q.q}</h2>
  <div class="opts">${Q.opts.map((o,i)=>`<button class="opt ${APP.ans[q]===i?'sel':''}" data-act="answer" data-i="${i}"><span class="opt-k">${o.t}</span></button>`).join('')}</div>`;
 },
 reveal(){
  const g=APP.g;
  return `<p class="eyebrow">国のかたちが決まった</p>
  <div class="frame">${sceneSVG(g,{mood:'gold'},{label:'建国の地'})}</div>

    <div class="nation">${flagSVG(g.flag,54,36)}<div class="stack" style="gap:4px;min-width:0"><h2 id="nname">${esc(g.name)}</h2><button class="link" data-act="reroll">別の国名にする</button></div><span></span></div>
    <p class="judge" id="judge">${esc(judgeLine(g))}</p>
    <div class="row">${typeBadge(g.type)}<span class="small muted">性格は、戦いの相性を決める</span></div>

 reign(){
  const g=APP.g,t=g.turn,logHtml=APP.log.map(resultBlock).join('');
  let action='';
  if(APP.phase==='card'){
    action=`<section class="stack"><div class="period"><b>この3年の事業</b><span class="small muted">1つ選ぶ</span></div>

  <div class="frame land">${sceneSVG(g,{mood:landMood(g),focus:APP.phase!=='card'?APP.lastBuilt:null},{label:'今の国の景色'})}</div>

  ${action}
  ${g.chron.length>1?`<section class="quiet"><p class="eyebrow">年代記</p>${chronList(g.chron.slice(-4).reverse())}</section>`:''}`;

 campaign(){
  const g=APP.g,c=APP.camp,o=c.opp,F=FIELDS[c.field];
  const a=adv(g.type,o.type);

  const homeP=F.home(g),homeE=F.home(o);
  const fhint=homeP&&homeE?'両国の地元の地形':homeP?'あなたの地元の地形':homeE?'相手の地元の地形':'どちらの地元でもない';
  const notes=[...c.mods.p.notes.map(n=>({...n,me:true})),...c.mods.e.notes];
  return `<div class="qhead"><span class="eyebrow">建国${yearOf(g.turn)}年 · ${esc(c.label)}</span></div>
  <div class="frame">${sceneSVG(g,{prop:'army',mood:c.kind==='final'?'war':'dusk'},{label:c.label})}</div>
  <section class="story"><p>${esc(c.intro)}</p></section>
  ${notes.length?`<section class="card"><p class="eyebrow">これまでの選択が、この戦いで効く</p><ul class="fates">${notes.map(n=>`<li class="${n.me?'':'bad'}">${esc(n.text)}</li>`).join('')}</ul></section>`:''}
  <div class="vs">${miniCard(g,'あなた')}${miniCard(o,'相手')}</div>
  <div class="hint">相性: ${hint}</div>
  <div class="hint">戦場: <b style="--c:var(--ink)">${F.name}</b> · ${fhint}</div>
  <section class="stack"><p class="eyebrow">作戦を選ぶ</p><div class="tactics">${Object.entries(TACTICS).map(([k,t])=>`<button class="tac ${c.tactic===k?'sel':''}" data-act="tactic" data-k="${k}" aria-pressed="${c.tactic===k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}</div></section>
  <button class="btn" data-act="fight">開戦</button>`;
 },
 battle(){

  return `<div class="bhead" style="--cp:${teamColor(g)};--ce:${teamColor(o,g)}">
    <div class="bside"><b>${esc(g.name)}</b><div class="stam" style="--c:${teamColor(g)}"><i id="stP"></i></div></div>
    <span class="vsmark">VS</span>
    <div class="bside r"><b>${esc(o.name)}</b><div class="stam" style="--c:${teamColor(o,g)}"><i id="stE"></i></div></div></div>
  <div class="arena"><canvas id="cv" aria-label="戦いの様子"></canvas><span class="field-tag">${F.name}</span></div>
  <div class="row" id="bctl"><button class="btn ghost sm" data-act="speed" id="spd">2倍速</button><button class="btn ghost sm" data-act="skip">結果まで飛ばす</button><span class="small muted">兵の数は残りの体力</span></div>
  <ol class="blog" id="blog" style="--cp:${teamColor(g)};--ce:${teamColor(o,g)}"></ol>
  <section class="card" id="bres" hidden></section>`;
 },
 ending(){
  const g=APP.g,e=endingOf(g),cs=chains(g);
  const kindName={bandit:'山賊団の討伐',invade:'侵攻',final:'決戦'};
  return `<p class="eyebrow">建国から30年 · 結末</p>
  <div class="frame">${sceneSVG(g,{mood:e.title==='滅びた国'?'war':'dusk',prop:e.title==='滅びた国'?'army':'lanterns'},{label:'30年後の景色'})}</div>
  <section class="card ending"><p class="small muted" style="text-align:center">${esc(g.name)}は、こう呼ばれた</p>
    <div class="title-big">${esc(e.epithet)}</div>
    <p class="verdict-line">${esc(e.title)}</p>
    <p class="closing">${esc(closingLine(g,e))}</p></section>
  <section class="card"><h3>この国の物語</h3><p class="small muted">選んだことが、何年か後に返ってきたつながり</p>
    ${cs.length?chainList(cs.slice(0,4)):'<p class="small muted">返ってきた選択はなかった。</p>'}</section>
  <section class="card">${countryCard(g)}
    <h3>戦い</h3><ul class="fates">${g.battles.map(b=>`<li>${kindName[b.kind]}: ${esc(b.name)} — ${b.win?'勝利':'敗北'}</li>`).join('')}</ul></section>
  <section class="card"><h3>年代記</h3>${chronList(g.chron,true)}</section>
  <div class="stack"><button class="btn" data-act="start">新しい国を建てる</button>
  <div class="row"><button class="btn ghost sm" data-act="copy">記録をコピー</button><button class="btn ghost sm" data-act="home">タイトルへ</button></div></div>`;
 },
};
function miniCard(g,label){
  return `<section class="card mini"><p class="eyebrow">${label}</p><div class="row" style="gap:8px">${flagSVG(g.flag,36,24)}${typeBadge(g.type)}</div><h3>${esc(g.name)}</h3>${statsPanel(g,true)}
  <div class="chips">${g.specials.map(spChip).join('')||'<span class="small muted">特技なし</span>'}</div></section>`;
}
function teamColor(g,other){const p=PAL[g.flag.climate]||PAL['温暖'];return other&&other.flag.climate===g.flag.climate?p.alt:p.team}

function show(screen){
  const changed=APP.screen!==screen;
  APP.screen=screen; root.innerHTML=VIEWS[screen]();
  if(changed||screen==='found') window.scrollTo(0,0);
  if(screen==='battle') startBattleView();
}
function scrollToAction(){const el=root.querySelector('.ev,[data-act="next"],[data-act="prep"]');if(el)el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:el.classList.contains('ev')?'start':'nearest'})}

/* 進行 */
function chron(g,text){g.chron.push({y:yearOf(g.turn),t:text})}
const gotText=r=>r.got&&r.got.length?` 特技「${r.got.map(id=>SPECIALS[id].name).join('」「')}」を身につけた。`:'';
function startTurn(){const g=APP.g;APP.phase='card';APP.cards=drawCards(g);APP.ev=null;APP.log=[];APP.lastBuilt=null;g.type=computeType(g.s)}
function afterStory(){APP.phase=battleKindAt(APP.g)?'prebattle':'end'}

root.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act,g=APP.g;
  switch(act){
   case 'start': APP=freshApp();show('found');break;
   case 'home': show('title');break;
   case 'back': if(APP.q>0){APP.q--;show('found')} else show('title');break;
   case 'answer':
     APP.ans[APP.q]=+el.dataset.i; APP.ans.length=APP.q+1;
     if(APP.q<QUESTIONS.length-1){APP.q++;show('found')}
     else {const n=buildFromAnswers(APP.ans);n.name=genName(n);n.flag=genFlag(n);n.type=computeType(n.s);APP.g=n;show('reveal')}
     break;
   case 'reroll': g.name=genName(g);$('#nname').textContent=g.name;$('#judge').textContent=judgeLine(g);break;
   case 'crown':
     g.chron=[{y:0,t:`${landPhrase(g)}に、${g.name}が建国された。`}];
     g.turn=1;startTurn();show('reign');break;
   case 'card':{
     const id=APP.cards[+el.dataset.i],r=playCard(g,id);
     APP.lastBuilt=id;APP.log=[r];chron(g,`${r.title}。${r.text}${gotText(r)}`);
     APP.ev=nextEvent(g);
     if(APP.ev) APP.phase='story'; else afterStory();
     show('reign');scrollToAction();break;}
   case 'choose':{
     const r=playEvent(g,APP.ev,+el.dataset.i);
     APP.log.push(r);chron(g,`${r.title.split(' · ')[0]}: ${r.text}${gotText(r)}`);
     APP.ev=null;afterStory();
     show('reign');scrollToAction();break;}
   case 'prep':{
     g.type=computeType(g.s);
     const kind=battleKindAt(g),b=battleSetup(g,kind);
     APP.camp={...b,mods:battleMods(g,kind),tactic:'rush',sim:null,applied:false};show('campaign');break;}
   case 'tactic': APP.camp.tactic=el.dataset.k;show('campaign');break;
   case 'fight':{
     const c=APP.camp,seed=(Math.random()*2147483647)|0;
     c.sim=simulate(g,c.opp,c.field,c.tactic,pick(Object.keys(TACTICS)),seed,c.mods);
     show('battle');break;}
   case 'speed': if(BATTLE){BATTLE.speed=BATTLE.speed===1?2:1;el.textContent=BATTLE.speed===1?'2倍速':'等速'}break;
   case 'skip': if(BATTLE) BATTLE.pos=BATTLE.sim.ticks.length-1;break;
   case 'back-reign':{
     const c=APP.camp;
     if(!c.applied){c.applied=true;const r=playOutcome(g,c.kind,c.sim.end.winner==='p',c.opp,c.mods);APP.log.push(r);chron(g,`${r.title}。${r.text}`)}
     if(c.kind==='final'){finalize(g);saveToHall();show('ending')}
     else {APP.phase='end';show('reign');scrollToAction()}
     break;}
   case 'next': g.turn++;startTurn();show('reign');break;
   case 'copy': copyResult();break;
  }
});

function saveToHall(){
  if(APP.saved) return; APP.saved=true;
  const g=APP.g,e=endingOf(g),list=loadHall();
  list.unshift({name:g.name,flag:g.flag,rank:g.rank,title:e.title,epithet:e.epithet});
  saveHall(list);
}
function shareText(){
  const g=APP.g,e=endingOf(g),c=chains(g)[0];
  return [`【建国サクセス】${g.name}「${e.epithet}」(${e.title})`,
    `${TYPES[g.type].name} · 国家ランク${g.rank} · `+STAT_KEYS.map(k=>`${SHORT[k]}${rankOf(g.s[k])}`).join(' '),
    c?c.map(n=>`${n.y}年 ${n.text}`).join(' → '):'',
    closingLine(g,e)].filter(Boolean).join('\n');
}
function copyResult(){
  const text=shareText();
  const fallback=()=>{
    if($('#copybox')) return;
    const ta=document.createElement('textarea');ta.id='copybox';ta.className='copybox';ta.value=text;ta.readOnly=true;
    root.appendChild(ta);ta.focus();ta.select();toast('選択した文字をコピーしてください');
  };
  try{navigator.clipboard.writeText(text).then(()=>toast('コピーしました'),fallback)}catch(e){fallback()}
}

/* ===== 観戦 ===== */
function startBattleView(){
  const c=APP.camp,g=APP.g,o=c.opp,sim=c.sim;
  const rng=mulberry32(sim.ticks.length*7919+sim.logs.length);
  const mkSoldiers=()=>Array.from({length:38},()=>({d:Math.pow(rng(),1.4),y:rng(),ph:rng()*6.28}));
  const marks=Array.from({length:46},()=>({x:rng(),y:rng(),s:.6+rng()*.8}));
  const img=f=>{const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(flagSVG(f,60,40));return i};
  BATTLE={sim,pos:0,speed:1,last:performance.now(),logIdx:0,done:false,
    sold:{p:mkSoldiers(),e:mkSoldiers()},marks,sparks:[],shake:0,lastTick:0,
    cp:teamColor(g),ce:teamColor(o,g),imgP:img(g.flag),imgE:img(o.flag)};
  requestAnimationFrame(battleFrame);
}
function battleFrame(now){
  const B=BATTLE; if(!B||APP.screen!=='battle') return;
  const cv=$('#cv'); if(!cv){BATTLE=null;return}
  const dt=Math.min(64,now-B.last);B.last=now;
  const n=B.sim.ticks.length-1;
  if(!B.done){B.pos=Math.min(n,B.pos+dt/(TICK_MS/B.speed))}
  const ti=Math.floor(B.pos);
  while(B.lastTick<ti){B.lastTick++;spawnSparks(B,B.sim.ticks[B.lastTick])}
  drawBattle(cv,B,dt);
  const lg=$('#blog');
  while(B.logIdx<B.sim.logs.length&&B.sim.logs[B.logIdx].t<=B.pos){
    const L=B.sim.logs[B.logIdx++],li=document.createElement('li');li.className=L.who;li.textContent=L.text;lg.appendChild(li);lg.scrollTop=lg.scrollHeight;
  }
  if(B.pos>=n&&!B.done){B.done=true;finishBattle()}
  if(!B.done||B.sparks.length) requestAnimationFrame(battleFrame);
}
function frontAt(B){const T=B.sim.ticks,i=Math.floor(B.pos),j=Math.min(T.length-1,i+1),u=B.pos-i;return {f:T[i].f+(T[j].f-T[i].f)*u,sp:T[i].sp+(T[j].sp-T[i].sp)*u,se:T[i].se+(T[j].se-T[i].se)*u}}
function spawnSparks(B,tk){
  if(!tk) return;
  const k=Math.min(14,2+Math.abs(tk.net)*1.4+(tk.crit?10:0));
  for(let i=0;i<k;i++) B.sparks.push({fx:true,y:Math.random(),vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.5+Math.random()*.4,gold:!!tk.crit});
  if(tk.crit&&!reduceMotion) B.shake=.18;
}
function drawBattle(cv,B,dt){
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),tok=v=>cs.getPropertyValue(v).trim();
  const ink=tok('--ink'),mark=tok('--f-mark');
  const {f,sp,se}=frontAt(B);
  $('#stP').style.width=sp+'%';$('#stE').style.width=se+'%';
  const fx=W/2+(f/100)*(W/2-30),top=44,bot=H-30;
  ctx.save();
  if(B.shake>0){B.shake-=dt/1000;ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*4)}
  ctx.fillStyle=tok('--'+FIELDS[B.sim.field].c);ctx.fillRect(-8,-8,W+16,H+16);
  ctx.strokeStyle=mark;ctx.fillStyle=mark;ctx.lineWidth=1.5;
  for(const m of B.marks){const x=m.x*W,y=top+m.y*(bot-top),s=m.s*7;ctx.beginPath();
    switch(B.sim.field){
     case 'mount':ctx.moveTo(x-s,y+s*.6);ctx.lineTo(x,y-s*.7);ctx.lineTo(x+s,y+s*.6);ctx.closePath();ctx.fill();break;
     case 'sea':ctx.moveTo(x-s,y);ctx.quadraticCurveTo(x-s/2,y-s*.6,x,y);ctx.quadraticCurveTo(x+s/2,y+s*.6,x+s,y);ctx.stroke();break;
     case 'snow':ctx.arc(x,y,s*.25,0,6.28);ctx.fill();break;
     case 'sand':ctx.moveTo(x-s*1.4,y);ctx.quadraticCurveTo(x,y-s*.8,x+s*1.4,y);ctx.stroke();break;
     default:ctx.moveTo(x-s*.4,y);ctx.lineTo(x-s*.1,y-s*.6);ctx.moveTo(x+s*.1,y);ctx.lineTo(x+s*.4,y-s*.6);ctx.stroke();
    }}
  ctx.globalAlpha=.22;ctx.fillStyle=B.cp;ctx.fillRect(0,0,fx,H);ctx.fillStyle=B.ce;ctx.fillRect(fx,0,W-fx,H);ctx.globalAlpha=1;
  const time=performance.now()/1000;
  const drawSide=(arr,color,stam,dir)=>{
    const count=Math.ceil(arr.length*(.25+.75*stam/100));
    const span=dir<0?fx-22:W-fx-22;
    ctx.fillStyle=color;ctx.strokeStyle=ink;ctx.lineWidth=.8;
    for(let i=0;i<count;i++){const s=arr[i];
      let x=fx+dir*(7+s.d*Math.max(10,span));
      if(s.d<.25&&!B.done) x+=Math.sin(time*9+s.ph)*2.2;
      const y=top+s.y*(bot-top);
      ctx.globalAlpha=.95;ctx.beginPath();ctx.roundRect?ctx.roundRect(x-3,y-3,6,6,1.5):ctx.rect(x-3,y-3,6,6);ctx.fill();ctx.globalAlpha=.35;ctx.stroke();}
    ctx.globalAlpha=1;
  };
  drawSide(B.sold.p,B.cp,sp,-1);drawSide(B.sold.e,B.ce,se,1);
  ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();
  for(let y=top-10,i=0;y<=bot+10;y+=10,i++) ctx.lineTo(fx+(i%2?3:-3),y);
  ctx.stroke();ctx.globalAlpha=1;
  const gold=tok('--gold');
  B.sparks=B.sparks.filter(p=>(p.life-=dt/1000)>0);
  for(const p of B.sparks){
    if(p.fx){p.x=fx;p.yy=top+p.y*(bot-top);p.fx=false}
    p.x+=p.vx*dt/1000;p.yy+=p.vy*dt/1000;
    ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.gold?gold:ink;ctx.fillRect(p.x-1.5,p.yy-1.5,3,3);
  }
  ctx.globalAlpha=1;
  const fw=36,fh=24;
  if(B.imgP.complete) ctx.drawImage(B.imgP,10,10,fw,fh);
  if(B.imgE.complete) ctx.drawImage(B.imgE,W-10-fw,10,fw,fh);
  ctx.restore();
}
function finishBattle(){
  const c=APP.camp,sim=c.sim,win=sim.end.winner==='p';
  $('#bctl').hidden=true;
  const el=$('#bres');el.hidden=false;
  el.innerHTML=`<div class="verdict ${win?'win':'lose'}">${win?'勝利':'敗北'}</div>
  <p class="small muted">${sim.end.how==='push'?'押し切って決着':'時間切れの判定'}</p>
  <p class="eyebrow">勝敗の理由</p><ul class="reasons">${sim.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
  <button class="btn" data-act="back-reign">${c.kind==='final'?'結末へ':'治世に戻る'}</button>`;
  el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});
}

/* 起動（公開ページの更新時も状態を引き継ぐ） */
window.claude?.hot?.snapshot?.(()=>({app:{...APP,camp:APP.camp?{...APP.camp,sim:APP.camp.applied?APP.camp.sim:null}:null}}));
function boot(data){
  if(data&&data.app&&data.app.ver===3&&data.app.screen){APP=data.app;if(APP.screen==='battle'){if(APP.camp&&!APP.camp.applied){APP.camp.sim=null;APP.screen='campaign'}else APP.screen='reign'}}
  try{show(APP.screen)}catch(e){APP=freshApp();show('title')}
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
